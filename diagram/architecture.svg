<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>Layered architecture of the Local Agent</title>
<desc>Clients talk through a CSRF and RBAC security layer to FastAPI routers, which call core services (tool registry, model state, cloud client, knowledge and audit), which in turn reach local dual-GPU llama-server, cloud LLM APIs, and SQLite/config storage.</desc>
<style>
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5} .c-gray text{fill:#2C2C2A}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5} .c-coral text{fill:#4A1B0C}
.c-pink rect{fill:#FBEAF0;stroke:#993556;stroke-width:0.5} .c-pink text{fill:#4B1528}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5} .c-teal text{fill:#04342C}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5} .c-purple text{fill:#26215C}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.ts{font-size:12px;fill:#5F5E5A} .th{font-size:14px;font-weight:500}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="340" y1="114" x2="340" y2="144" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="194" x2="340" y2="224" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="279" x2="340" y2="309" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="374" x2="340" y2="409" class="arr" marker-end="url(#arrow)"/>

<text x="44" y="52" class="ts">Clients</text>
<g class="c-gray"><rect x="90" y="64" width="200" height="50" rx="4"/>
<text x="190" y="86" class="th" text-anchor="middle">Browser UI</text>
<text x="190" y="103" class="ts" text-anchor="middle">Chat &amp; Agent Task UI</text></g>
<g class="c-gray"><rect x="320" y="64" width="230" height="50" rx="4"/>
<text x="435" y="86" class="th" text-anchor="middle">External API clients</text>
<text x="435" y="103" class="ts" text-anchor="middle">curl, SDKs, LM Studio</text></g>

<text x="44" y="132" class="ts">Security</text>
<g class="c-coral"><rect x="90" y="144" width="200" height="50" rx="4"/>
<text x="190" y="166" class="th" text-anchor="middle">CSRF middleware</text>
<text x="190" y="183" class="ts" text-anchor="middle">Cross-site request check</text></g>
<g class="c-coral"><rect x="320" y="144" width="230" height="50" rx="4"/>
<text x="435" y="166" class="th" text-anchor="middle">RBAC session gate</text>
<text x="435" y="183" class="ts" text-anchor="middle">Per-route permission check</text></g>

<text x="44" y="212" class="ts">API routes — FastAPI routers</text>
<g class="c-pink"><rect x="50" y="224" width="180" height="55" rx="4"/>
<text x="140" y="247" class="th" text-anchor="middle">Control &amp; agent</text>
<text x="140" y="264" class="ts" text-anchor="middle">Status, config, run</text></g>
<g class="c-pink"><rect x="250" y="224" width="180" height="55" rx="4"/>
<text x="340" y="247" class="th" text-anchor="middle">Chat &amp; cloud</text>
<text x="340" y="264" class="ts" text-anchor="middle">Direct chat, cloud lanes</text></g>
<g class="c-pink"><rect x="450" y="224" width="180" height="55" rx="4"/>
<text x="540" y="247" class="th" text-anchor="middle">Projects &amp; admin</text>
<text x="540" y="264" class="ts" text-anchor="middle">Sessions, KB, git</text></g>

<text x="44" y="297" class="ts">Core services</text>
<g class="c-teal"><rect x="50" y="309" width="130" height="65" rx="4"/>
<text x="115" y="331" class="th" text-anchor="middle">Registry</text>
<text x="115" y="349" class="ts" text-anchor="middle">MCP, plugins,</text>
<text x="115" y="363" class="ts" text-anchor="middle">skills, shell</text></g>
<g class="c-teal"><rect x="200" y="309" width="130" height="65" rx="4"/>
<text x="265" y="331" class="th" text-anchor="middle">Model state</text>
<text x="265" y="349" class="ts" text-anchor="middle">Lifecycle &amp;</text>
<text x="265" y="363" class="ts" text-anchor="middle">watchdog</text></g>
<g class="c-teal"><rect x="350" y="309" width="130" height="65" rx="4"/>
<text x="415" y="331" class="th" text-anchor="middle">Cloud client</text>
<text x="415" y="349" class="ts" text-anchor="middle">Remote model</text>
<text x="415" y="363" class="ts" text-anchor="middle">routing</text></g>
<g class="c-teal"><rect x="500" y="309" width="130" height="65" rx="4"/>
<text x="565" y="331" class="th" text-anchor="middle">KB &amp; audit</text>
<text x="565" y="349" class="ts" text-anchor="middle">PAN filter,</text>
<text x="565" y="363" class="ts" text-anchor="middle">audit logs</text></g>

<text x="44" y="397" class="ts">Runtime &amp; storage</text>
<g class="c-teal"><rect x="50" y="409" width="180" height="55" rx="4"/>
<text x="140" y="432" class="th" text-anchor="middle">Local llama-server</text>
<text x="140" y="449" class="ts" text-anchor="middle">Dual A770, Vulkan</text></g>
<g class="c-purple"><rect x="250" y="409" width="180" height="55" rx="4"/>
<text x="340" y="432" class="th" text-anchor="middle">Cloud LLM APIs</text>
<text x="340" y="449" class="ts" text-anchor="middle">OpenAI-compatible</text></g>
<g class="c-gray"><rect x="450" y="409" width="180" height="55" rx="4"/>
<text x="540" y="432" class="th" text-anchor="middle">SQLite &amp; config</text>
<text x="540" y="449" class="ts" text-anchor="middle">Projects, usage, auth</text></g>

<rect x="44" y="486" width="10" height="10" fill="#D85A30"/><text x="60" y="495" class="ts">Security</text>
<rect x="150" y="486" width="10" height="10" fill="#D4537E"/><text x="166" y="495" class="ts">API routes</text>
<rect x="260" y="486" width="10" height="10" fill="#1D9E75"/><text x="276" y="495" class="ts">Compute / core</text>
<rect x="410" y="486" width="10" height="10" fill="#7F77DD"/><text x="426" y="495" class="ts">Cloud</text>
<rect x="480" y="486" width="10" height="10" fill="#B4B2A9"/><text x="496" y="495" class="ts">Client / storage</text>
</svg>
