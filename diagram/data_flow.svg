<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>Data flow of the A770 Dual Runtime</title>
<desc>Four parallel data flows: a chat message becomes a stored message row, a tool file write becomes a workspace file plus an in-memory diff, every request becomes a usage record, and a knowledge upload passes a PAN filter before becoming an indexed, audited source.</desc>
<style>
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5} .c-gray text{fill:#2C2C2A}
.c-coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5} .c-coral text{fill:#4A1B0C}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5} .c-teal text{fill:#04342C}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.ts{font-size:12px} .th{font-size:14px;font-weight:500}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="90" y1="90" x2="90" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="90" y1="170" x2="90" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="90" x2="255" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="170" x2="255" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="90" x2="420" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="170" x2="420" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="585" y1="90" x2="585" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="585" y1="170" x2="585" y2="200" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="30" y="50" width="120" height="40" rx="4"/>
<text x="90" y="75" class="th" text-anchor="middle">Chat message</text></g>
<g class="c-coral"><rect x="30" y="120" width="120" height="50" rx="4"/>
<text x="90" y="142" class="th" text-anchor="middle">Agent SSE loop</text>
<text x="90" y="159" class="ts" text-anchor="middle">appends to history</text></g>
<g class="c-teal"><rect x="30" y="200" width="120" height="50" rx="4"/>
<text x="90" y="222" class="th" text-anchor="middle">messages table</text>
<text x="90" y="239" class="ts" text-anchor="middle">projects.db</text></g>

<g class="c-gray"><rect x="195" y="50" width="120" height="40" rx="4"/>
<text x="255" y="75" class="th" text-anchor="middle">Tool file write</text></g>
<g class="c-coral"><rect x="195" y="120" width="120" height="50" rx="4"/>
<text x="255" y="142" class="th" text-anchor="middle">Workspace sandbox</text>
<text x="255" y="159" class="ts" text-anchor="middle">path check, snapshot</text></g>
<g class="c-teal"><rect x="195" y="200" width="120" height="50" rx="4"/>
<text x="255" y="222" class="th" text-anchor="middle">Files + session diff</text>
<text x="255" y="239" class="ts" text-anchor="middle">disk, in-memory</text></g>

<g class="c-gray"><rect x="360" y="50" width="120" height="40" rx="4"/>
<text x="420" y="75" class="th" text-anchor="middle">Any HTTP request</text></g>
<g class="c-coral"><rect x="360" y="120" width="120" height="50" rx="4"/>
<text x="420" y="142" class="th" text-anchor="middle">Proxy monitor</text>
<text x="420" y="159" class="ts" text-anchor="middle">tok/s, duration</text></g>
<g class="c-teal"><rect x="360" y="200" width="120" height="50" rx="4"/>
<text x="420" y="222" class="th" text-anchor="middle">requests table</text>
<text x="420" y="239" class="ts" text-anchor="middle">usage.db</text></g>

<g class="c-gray"><rect x="525" y="50" width="120" height="40" rx="4"/>
<text x="585" y="75" class="th" text-anchor="middle">Knowledge upload</text></g>
<g class="c-coral"><rect x="525" y="120" width="120" height="50" rx="4"/>
<text x="585" y="142" class="th" text-anchor="middle">Ingest + PAN filter</text>
<text x="585" y="159" class="ts" text-anchor="middle">rejects card numbers</text></g>
<g class="c-teal"><rect x="525" y="200" width="120" height="50" rx="4"/>
<text x="585" y="222" class="th" text-anchor="middle">KB index + audit log</text>
<text x="585" y="239" class="ts" text-anchor="middle">indexed, logged</text></g>

<rect x="44" y="285" width="10" height="10" fill="#B4B2A9"/><text x="60" y="294" class="ts">Source event</text>
<rect x="190" y="285" width="10" height="10" fill="#D85A30"/><text x="206" y="294" class="ts">Processing step</text>
<rect x="360" y="285" width="10" height="10" fill="#1D9E75"/><text x="376" y="294" class="ts">Persisted data</text>
</svg>
