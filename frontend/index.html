<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/static/logo/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1915" />
    <link rel="apple-touch-icon" href="/static/logo/icon-192.png" />
    <title>%VITE_PROJECT_NAME%</title>
    <!-- Boot loader: plain HTML + CSS, painted from the first frame (no JavaScript needed), kept up until the app knows whether you are
         signed in (App.tsx calls dismissBootLoader). React's AppLoader only updates its text, so nothing restarts or flickers. Inline style is allowed by the CSP. -->
    <style>
      #boot-loader { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center;
        background: var(--bg, #0d1117); transition: opacity .25s ease; }
      #boot-loader.boot-out { opacity: 0; pointer-events: none; }
      #boot-loader .boot-glow { position: absolute; width: 520px; height: 520px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent, #58a6ff) 0%, transparent 65%); opacity: .10; filter: blur(30px); }
      #boot-loader .boot-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #boot-loader .boot-mark { position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; }
      #boot-loader .boot-mark img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; box-shadow: 0 6px 24px rgba(0,0,0,.35);
        animation: boot-pulse 2s ease-in-out infinite; }
      #boot-loader .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--border, rgba(128,128,128,.25));
        border-top-color: var(--accent, #58a6ff); animation: boot-spin 1.1s linear infinite; }
      #boot-loader .boot-ring.slow { inset: 9px; border-top-color: transparent; border-right-color: var(--accent, #58a6ff); opacity: .55;
        animation-duration: 1.9s; animation-direction: reverse; }
      #boot-loader .boot-text { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text, #e6edf3); }
      #boot-loader .boot-sub { margin-top: -14px; min-height: 14px; font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--dim, #8b949e); max-width: 260px; text-align: center; }
      #boot-loader .boot-bar { width: 180px; height: 3px; border-radius: 3px; background: var(--border, rgba(128,128,128,.25)); overflow: hidden; }
      #boot-loader .boot-bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--accent, #58a6ff);
        animation: boot-slide 1.3s ease-in-out infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .boot-mark img { animation: none; }
        #boot-loader .boot-ring { animation-duration: 3s; }
        #boot-loader .boot-bar span { animation: none; width: 100%; opacity: .5; }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading the application">
      <div class="boot-glow" aria-hidden="true"></div>
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true"><span class="boot-ring"></span><span class="boot-ring slow"></span><img src="/static/logo/logo.jpg" alt="" width="56" height="56" /></div>
        <div class="boot-text" id="boot-text">Loading…</div>
        <div class="boot-sub" id="boot-sub"></div>
        <div class="boot-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script src="/static/vendor/xlsx.full.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
