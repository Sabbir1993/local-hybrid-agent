<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — A770 Runtime</title>
<script>
  (function() {
    var t = localStorage.getItem('a770_theme') || 'claude';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/static/css/style.css?v=3.0">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:var(--bg); }
  #login-box { width:340px; max-width:90vw; padding:28px 24px; border:1px solid var(--border); border-radius:12px; background:var(--bg-input, var(--bg)); }
  #login-box h1 { font-size:16px; margin:0 0 4px; color:var(--fg, #eee); }
  #login-box p.sub { color:var(--dim); font-size:12px; margin:0 0 18px; }
  #login-box label { display:block; font-size:11px; color:var(--dim); margin:12px 0 4px; letter-spacing:0.5px; text-transform:uppercase; }
  #login-box input { width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-input, transparent); color:inherit; font-size:13px; }
  #login-err { color:#f85149; font-size:12px; min-height:16px; margin-top:10px; }
  #login-submit { width:100%; margin-top:16px; padding:10px; }
</style>
</head>
<body>
<div id="login-box" class="card">
  <h1>⬡ A770 RUNTIME</h1>
  <p class="sub">Sign in to continue</p>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div id="login-err"></div>
    <button id="login-submit" class="btn accent" type="submit">Sign in</button>
  </form>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('login-err');
  errBox.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    const resp = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ username, password }),
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      errBox.textContent = data.detail || 'Sign in failed';
      return;
    }
    const params = new URLSearchParams(location.search);
    location.href = params.get('next') || '/';
  } catch (err) {
    errBox.textContent = 'Network error — is the server running?';
  }
});
</script>
</body>
</html>
